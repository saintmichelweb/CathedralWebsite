openapi: 3.0.0
info:
  title: St Michel Website API
  version: 0.1.0
  description: St Michel Website Backend
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /catholic-actions/{id}:
    delete:
      tags:
        - Catholic Actions
      security:
        - Authorization: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Catholic Actions ID
      summary: delete a Mass Catholic Actions
      responses:
        '200':
          description: Catholic Actions deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Catholic Actions deleted successfully
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid credentials
        '500':
          description: Internal Server error
    put:
      tags:
        - Catholic Actions
      security:
        - Authorization: []
      summary: Update a Catholic Actions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Catholic Actions ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description_en
                - description_fr
                - description_rw
                - leader
                - telephone
              properties:
                name:
                  type: string
                  example: Choir
                  description: Name of the choir
                description_en:
                  type: string
                  example: English description
                  description: Choir description in English
                description_fr:
                  type: string
                  example: Description en français
                  description: Choir description in French
                description_rw:
                  type: string
                  example: Ibisobanuro mu Kinyarwanda
                  description: Choir description in Kinyarwanda
                leader:
                  type: string
                  example: John Doe
                  description: Leader of the choir
                telephone:
                  type: string
                  example: '+250788123456'
                  description: Telephone number of the choir leader
                backgroundImageId:
                  type: number
                  example: 101
                  nullable: true
                  description: Optional background image ID
                isActive:
                  type: boolean
                  example: true
                  description: Whether the choir is active
      responses:
        '200':
          description: Catholic Actions saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Catholic Actions updated successfully.
        '401':
          description: Invalid credentials!
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid credentials!
        '404':
          description: Catholic Actions not found!
        '422':
          description: Validation error!
        '500':
          description: Internal Server error!
