# command to build staging compose file
# docker compose -f docker-compose-prod.yml up -d --build

networks:
  stmp-net:
    name: stmp-net

services:
  front-end:
    build:
      context: ./Front-end
      # dockerfile: ./Portal/DockerFile
      dockerfile: ./DockerFile-Front-End
    restart: unless-stopped
    ports:
      # - "3000:3000" #use if the port is used by an other container
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://83.147.37.125:3551
    networks:
      - stmp-net
    volumes:
      - ./Front-end:/app
      # - /app/node_modules

  portal:
    build:
      context: .
      dockerfile: ./DockerFile-Portal-prod
    restart: unless-stopped
    ports:
      - "3550:3550"

  api:
    build:
      context: .
      dockerfile: ./DockerFile-Api-prod
    restart: unless-stopped
    command: [ "npm", "run", "start" ]
    ports:
      - "3551:3551"
    networks:
      - stmp-net
    depends_on:
      - stmp-db
    env_file:
      - Api/.env.prod

  stmp-db:
    container_name: stmp-db
    image: mysql:8.0.33
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=U3QgTWljaGVsIEtpZ2FsaSBDYXRoZWRyYWw=
    ports:
      - 3552:3306
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./mysql-init-scripts:/docker-entrypoint-initdb.d
    networks:
      - stmp-net
