version: "3.9"

networks:
  stmp-net:
    name: stmp-net

services:
  front-end:
    build:
      context: ./Front-end
      dockerfile: ./DockerFile-Front-End
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://saintmichel.rw/api
    networks:
      - stmp-net
    # Remove this in production
    # volumes:
    #   - ./Front-end:/app

  portal:
    build:
      context: .
      dockerfile: ./DockerFile-Portal-prod
    restart: unless-stopped
    ports:
      - "3550:3550"
    networks:
      - stmp-net  # ✅ added so Nginx can reach it

  api:
    build:
      context: .
      dockerfile: ./DockerFile-Api-prod
    restart: unless-stopped
    command: [ "npm", "run", "start" ]
    ports:
      - "3551:3551"
    networks:
      - stmp-net
    depends_on:
      - stmp-db
    env_file:
      - Api/.env.prod

  stmp-db:
    container_name: stmp-db
    image: mysql:8.0.33
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=U3QgTWljaGVsIEtpZ2FsaSBDYXRoZWRyYWw=
    ports:
      - "3552:3306"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./mysql-init-scripts:/docker-entrypoint-initdb.d
    networks:
      - stmp-net
